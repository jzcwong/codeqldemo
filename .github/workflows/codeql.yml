# CodeQL analysis for the demo repo.
#
# Two languages are analyzed on push, PR, and a weekly schedule:
#   - python     (Flask app)
#   - javascript (static/app.js)
#
# Uses the `security-and-quality` query suite so both security and
# maintainability queries run — gives the demo more alerts to walk through.

name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # schedule:
  #   - cron: "23 6 * * 1"  # Mondays, 06:23 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required to upload SARIF to Security tab
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #v4.38.0
        with:
          languages: ${{ matrix.language }}
          # `queries:` is a comma-separated list. Entries can be a built-in
          # suite name (default, security-extended, security-and-quality), a
          # path to a .qls suite file, a path to a directory of .ql files, or
          # a published pack reference (owner/name@version).
          # See .github/codeql/README.md for how the custom suite is built.
          queries: security-and-quality,./.github/codeql/custom-queries/custom-suite.qls

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #v4.38.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 #v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
